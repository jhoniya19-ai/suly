<title>Diego &amp; Suly · Operación Sí, Acepto</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f0eb;--paper:#e9e4d7;--card:#f6f3ec;--ink:#4a2a24;--bur:#5e1426;--olive:#5b6b2f;--acc:#b4502b;--accink:#fff;--line:#d8cdb6;--gold:#b8892f;--mut:#7a6a5c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1512;--paper:#2a201b;--card:#352820;--ink:#f1e4d3;--bur:#efb9aa;--olive:#b5c27e;--acc:#d2693d;--line:#4a3a30;--mut:#b9a796}}
:root[data-theme="dark"]{--bg:#1c1512;--paper:#2a201b;--card:#352820;--ink:#f1e4d3;--bur:#efb9aa;--olive:#b5c27e;--acc:#d2693d;--line:#4a3a30;--mut:#b9a796}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.4 'Cormorant Garamond',Georgia,serif}
main{position:relative;max-width:460px;margin:0 auto;min-height:100vh;padding:34px 18px 48px;background:repeating-linear-gradient(45deg,transparent 0 2px,rgba(120,100,70,.05) 2px 3px),var(--paper);overflow:hidden}
.fl{position:absolute;width:130px;height:130px;pointer-events:none;z-index:0}
.fl.tl{top:-6px;left:-8px}.fl.tr{top:-6px;right:-8px;transform:scaleX(-1)}.fl.bl{bottom:-6px;left:-8px;transform:scaleY(-1)}.fl.br{bottom:-6px;right:-8px;transform:scale(-1,-1)}
main>*:not(.fl){position:relative;z-index:1}
.seal{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;background:radial-gradient(circle at 35% 30%,#d9a15a,#a86a22 70%);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.hero{text-align:center;padding:10px 0 4px}
.hero .tag{margin-top:4px}
h1{font:400 54px/1 'Great Vibes',cursive;color:var(--bur);margin:6px 0 2px;transform:rotate(-3deg)}
.hero h2{font:700 20px/1.2 'Cormorant Garamond',serif;color:var(--bur);margin:2px 0}
.sub{color:var(--mut);font-size:17px;margin:4px 0 12px;text-align:center}
.tag{font:700 12px/1 'Cormorant Garamond',serif;letter-spacing:3px;color:var(--acc);text-transform:uppercase}
.tabs{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;color:var(--mut);border:0;border-radius:0;padding:8px 14px;font:700 20px 'Cormorant Garamond',serif;border-bottom:2px solid transparent}
.tabs button:not(.ghost){color:var(--bur);border-bottom-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.role{font:400 38px/1.1 'Great Vibes',cursive;color:var(--bur);margin:6px 0 2px}
.mission{border-top:1px dashed var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.mission:first-of-type{border-top:0}
.mission.done{opacity:.55}
.mission p{margin:0;font-size:19px;flex:1}
button,label.btn{font:700 17px 'Cormorant Garamond',serif;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;display:inline-block;text-align:center}
button.ghost{background:transparent;color:var(--bur);border:1px solid var(--line)}
input[type=text]{width:100%;font:18px 'Cormorant Garamond',serif;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid figure{margin:0;background:#fff;padding:6px 6px 0;border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.15);transform:rotate(-1.5deg)}
.grid figure:nth-child(even){transform:rotate(1.5deg)}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.grid figcaption{font:600 14px 'Cormorant Garamond',serif;color:#5e1426;padding:6px 2px;text-align:center}
.msg{color:var(--mut);text-align:center;padding:10px;font-size:17px}
.hide{display:none}
input[type=file]{display:none}
.foto{width:230px;margin:6px auto 4px;padding:8px 8px 22px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);transform:rotate(3deg)}.foto img{width:100%;display:block;border:1px solid var(--gold)}</style>
</head>

<script>
const SETS=[

["Amigos","Vigila a los inseparables.",["Un grupo de amigos riendo","Dos amigos de toda la vida","Amigos haciendo una pose graciosa"]],

["Recuerdos","Guardián de la memoria.",["Un detalle que quieras recordar siempre","Alguien tomando fotos","Un momento tranquilo entre invitados"]],
["Caballero","Especialista en trajes.",["Un hombre con corbata o moño","Un saco o traje bien planchado","Un padrino con los novios"]],
["Dama","Especialista en vestidos.",["Un vestido bonito","Las damas de honor juntas","Un accesorio que destaque"]],
["Humor","Agente de la risa.",["Una cara graciosa","Alguien haciendo reír a otros","Una pose divertida con alguien"]],
["Lugar","Reconoce el territorio.",["El lugar de la boda desde lejos","Un rincón bonito del lugar","La entrada o el letrero de bienvenida"]],
["Gratitud","Captura la gratitud.",["Alguien agradeciendo a otro","Un apretón de manos","Los novios saludando a un invitado"]],
["Padrinos","Escolta de los novios.",["Los padrinos o testigos","Los papás de los novios","Un detalle de los novios con sus familias"]],
["Grupo","Maestro del retrato colectivo.",["Una foto con 5 o más personas","Todos los de tu mesa abrazados","Una foto grupal con los novios"]]
].map(x=>({n:x[0],d:x[1],m:x[2]}));
const CODES="Halcón Lince Pantera Tigre Cóndor Águila Zorro Lobo Búho Delfín Colibrí Jaguar Puma Gaviota Pelícano Tucán Cisne Gacela Venado Caballo Fénix Orquídea Rubí Zafiro Esmeralda Diamante Perla Ópalo Topacio Amatista Jade Coral Ámbar Cuarzo Granate Turquesa Onix Sol Luna Estrella Cometa Aurora Rayo Trueno Brisa Marea Cascada Volcán Montaña Roble Cedro Pino Olivo Girasol Lirio Rosa Jazmín Laurel Trébol Cerezo Manzano Almendra Canela Vainilla Miel Menta Limón Naranja Mango Fresa Cacao Café Trigo Maíz Plata Oro Bronce Acero Cobre Faro Ancla Brújula Timón Velero Puente Torre Castillo Escudo Espada Corona Llave Campana Reloj Espejo Linterna Mapa Dardo Sombrero Arcoíris Cielo".split(" ");
const ROLES=CODES.map((c,i)=>{const S=SETS[i%SETS.length];return{n:"Agente "+c,d:"Especialidad: "+S.n+". "+S.d,m:S.m}});
let claimed=new Set();
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let state=null,current=null,dbRef=null,assets=null,dbc=null;

function show(v){
  $('vMis').classList.toggle('hide',v!=='m');$('vGal').classList.toggle('hide',v!=='g');
  $('tMis').classList.toggle('ghost',v!=='m');$('tGal').classList.toggle('ghost',v!=='g');
}
$('tMis').onclick=()=>show('m');$('tGal').onclick=()=>show('g');

function load(){try{return JSON.parse(store.get('espia')||'null')}catch(e){return null}}
function save(){store.set('espia',JSON.stringify(state))}

function render(){
  if(!state){return}
  $('intro').classList.add('hide');$('agent').classList.remove('hide');
  const r=ROLES[state.r];
  $('rName').textContent=r.n;$('rDesc').textContent=r.d;
  const box=$('missions');box.innerHTML='';
  r.m.forEach((t,i)=>{
    const done=state.done.includes(i);
    const row=document.createElement('div');row.className='mission'+(done?' done':'');
    const p=document.createElement('p');p.textContent=(done?'✓ ':'')+t;
    const b=document.createElement('button');b.textContent=done?'Repetir':'📸 Foto';
    if(done)b.className='ghost';
    b.onclick=()=>{current=i;$('cam').click()};
    row.append(p,b);box.append(row);
  });
}

$('go').onclick=()=>{
  const free=ROLES.map((_,i)=>i).filter(i=>!claimed.has(i));const pool=free.length?free:ROLES.map((_,i)=>i);
  const r=pool[Math.floor(Math.random()*pool.length)];
  state={r:r,n:$('nombre').value.trim(),done:[]};
  save();render();
  try{if(dbc)dbc.collection('roles').doc(String(r)).set({ts:Date.now()})}catch(e){}
};

function setStatus(t){const s=$('status');s.textContent=t;s.classList.toggle('hide',!t)}

function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,1400/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82);
    };
    img.onerror=()=>rej(new Error('img'));img.src=u;
  });
}

$('cam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||current===null)return;
  if(!assets||!dbc){setStatus('No pude conectar con la galería. Avísale a los novios.');return}
  setStatus('Subiendo tu foto… 🕵️');
  try{
    const blob=await shrink(f);
    const up=await assets.upload(blob);
    const r=ROLES[state.r];
    await dbc.collection('photos').add({asset:up.id,role:r.n,mission:r.m[current],name:state.n||'',ts:Date.now()});
    if(!state.done.includes(current))state.done.push(current);
    save();render();setStatus('¡Misión cumplida! Foto enviada ✅');
  }catch(err){setStatus('No se pudo subir la foto. Intenta de nuevo.')}
};

function renderGal(docs){
  const g=$('grid');g.innerHTML='';
  const items=docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>b.ts-a.ts);
  $('galMsg').textContent=items.length?items.length+' fotos hasta ahora':'Todavía no hay fotos. ¡Sé el primero!';
  items.forEach(x=>{
    const fig=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');
    im.src='/_blob/'+x.asset;im.loading='lazy';im.alt=x.mission;
    cap.textContent=x.role+(x.name?' · '+x.name:'');
    fig.append(im,cap);g.append(fig);
  });
}

(async()=>{
  state=load();if(state)render();
  try{
    assets=await claude.use('assets');
    dbc=await claude.use('db');
    if(dbc){dbc.collection('roles').onSnapshot(x=>{claimed=new Set(x.docs.map(d=>+d.id))},()=>{});dbc.collection('photos').onSnapshot(s=>renderGal(s.docs),()=>{$('galMsg').textContent='No se pudo cargar la galería.'})}
    else{$('galMsg').textContent='La galería no está disponible en este momento.'}
  }catch(e){$('galMsg').textContent='La galería no está disponible en este momento.'}
})();
</script>
